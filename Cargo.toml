[workspace]
members = ["crates/windows-credential", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
cyberkindred-windows-credential = { version = "=0.1.0", path = "crates/windows-credential" }
hex = "=0.4.3"
infer = "=0.22.0"
jsonschema = { version = "=0.52.1", default-features = false }
lofty = "=0.25.1"
mime = "=0.3.17"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json"] }
rodio = "=0.22.2"
secrecy = "=0.10.3"
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false }
symphonia = "=0.6.1"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-single-instance = "=2.4.4"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
url = "=2.5.8"
uuid = "=1.26.0"
windows = "=0.62.2"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
