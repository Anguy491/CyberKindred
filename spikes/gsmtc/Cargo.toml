[package]
name = "cyberkindred-gsmtc-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
