[package]
name = "cyberkindred"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cyberkindred_lib"
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
cyberkindred-windows-credential.workspace = true
hex.workspace = true
infer.workspace = true
jsonschema.workspace = true
lofty.workspace = true
reqwest.workspace = true
rodio.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
symphonia = { workspace = true, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-autostart.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
url.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
cyberkindred-windows-power-observer.workspace = true
notify-rust.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Management_Deployment",
    "Media_Control",
    "Storage_Streams",
] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
